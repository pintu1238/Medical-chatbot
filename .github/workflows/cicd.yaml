name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches:
      - main

jobs:

  Continuous-Integration:

    runs-on: ubuntu-latest

    steps:

      # CHECKOUT CODE
      - name: Checkout
        uses: actions/checkout@v3

      # AWS CONFIG
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # LOGIN TO ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # BUILD + PUSH IMAGE
      - name: Build, tag, and push image to Amazon ECR
        id: build-image

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest

        run: |

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT


  Continuous-Deployment:

    needs: Continuous-Integration

    runs-on: self-hosted

    steps:

      # CHECKOUT CODE
      - name: Checkout
        uses: actions/checkout@v3

      # AWS CONFIG
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # LOGIN TO ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # STOP OLD CONTAINER
      - name: Stop old container
        run: |
          docker stop medical-chatbot-container || true
          docker rm medical-chatbot-container || true

      # REMOVE OLD IMAGE
      - name: Remove old image
        run: |
          docker image prune -af || true

      # PULL LATEST IMAGE
      - name: Pull latest image
        run: |
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest

      # RUN CONTAINER
      - name: Run Docker Container
        run: |

          docker run -d \
          --name medical-chatbot-container \
          -p 8080:8080 \
          -e PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
          -e GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest